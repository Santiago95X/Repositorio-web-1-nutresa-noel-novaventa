<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrición - Sazón</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/sazon.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="nutricion.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="nutricion-wrapper">
        <header class="nutricion-header">
            <div class="header-text">
                <h1>Nutrición y Bienestar</h1>
                <p>Descubre el valor nutricional de tus recetas favoritas.</p>
            </div>
<!-- 5: Santiago - Interfaz de Busqueda y Tarjetas -->
<div class="nutricion-seccion-santiago">
    <div class="nutricion-hero">
        <h2 style="display: flex; justify-content: center; align-items: center; gap: 10px;"><span class="material-symbols-outlined" style="font-size: 2.2rem;">monitor_heart</span> Catálogo Nutricional</h2>
        <p>Encuentra los valores nutricionales exactos para tus recetas.</p>
    </div>
    <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="buscador-nutricion" placeholder="Buscar receta por nombre..." maxlength="30" required>
    </div>
    <p id="error-busqueda" class="error-validacion">Por favor, ingrese un término de búsqueda válido (solo letras).</p>
    <p id="contador-resultados" class="contador-texto"></p>
    <div id="lista-nutricion" class="grid-recetas"></div>
</div>
</header>
</main>
<div id="footer"></div>
<script src="../../assets/js/layout.js"></script>
<script type="module" src="nutricion.ui.js"></script>
</body>
</html>
