<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Receta - Sazón</title>
    <link rel="stylesheet" href="../../assets/css/sazon.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="nutricion.css">
    <style>
        body { background-color: #F8F9FA; margin: 0; }
        .detalle-wrapper { max-width: 1000px; margin: 3rem auto; padding: 0 1rem; font-family: 'Inter', sans-serif; }
        .btn-volver { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; color: var(--verde-noche); border: 1px solid rgba(0,0,0,0.1); padding: 0.6rem 1.2rem; border-radius: 30px; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 2rem; text-decoration: none; }
        .btn-volver:hover { background: var(--verde-nutresa); color: #ffffff; border-color: var(--verde-nutresa); transform: translateX(-5px); }
        .detalle-card { background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .detalle-card img { width: 100%; height: 400px; object-fit: cover; }
        .detalle-info { padding: 3rem; }
        .detalle-info h1 { font-family: 'Poppins', sans-serif; color: var(--verde-noche); font-size: 2.5rem; margin-top: 0; margin-bottom: 1rem; }
        .detalle-info p { font-size: 1.1rem; color: var(--gris-texto); line-height: 1.6; margin-bottom: 2rem; }
        .detalle-badges { display: flex; gap: 1.5rem; font-weight: 600; color: var(--verde-nutresa); font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 2rem; margin-bottom: 2rem; }
        .detalle-info h3 { font-family: 'Poppins', sans-serif; color: var(--gris-texto); opacity: 0.6; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <main class="detalle-wrapper">
        <a href="index.html" class="btn-volver">
            <span class="material-symbols-outlined">arrow_back</span> Volver al catálogo
        </a>
        <div id="detalle-contenido" class="detalle-card">
        </div>
    </main>
    <div id="footer"></div>
    <script src="../../assets/js/layout.js"></script>
    <script type="module" src="nutricion.detalle.js"></script>
</body>
</html>
