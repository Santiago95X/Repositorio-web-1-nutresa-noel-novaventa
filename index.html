<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazón - Nutresa Digital</title>
    <link rel="stylesheet" href="assets/css/layout-global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <!-- Sidebar Inyectado por JS -->
    <aside id="sidebar-global"></aside>

    <div class="main-container">
        <!-- Header Inyectado por JS -->
        <header data-layout="header"></header>

        <main class="content-area">
            <!-- Hero Section basada en la imagen 1 -->
            <section class="hero-inicio">
                <span class="badge">RECETARIO DIGITAL · GRUPO NUTRESA</span>
                <h1>Cocina con lo que tienes en casa.</h1>
                <p>Explora recetas con productos Nutresa, organiza tu despensa y planea el menú de tu semana en un solo lugar.</p>
                
                <div class="buscador-despensa">
                    <label for="input-despensa">¿QUÉ TIENES EN TU DESPENSA?</label>
                    <div class="input-group">
                        <input type="text" id="input-despensa" placeholder="Ej: pasta, salchicha, cebolla">
                        <button class="btn-primary">Buscar recetas</button>
                    </div>
                </div>

                <div class="tags-rapidos">
                    <span>Salchicha Ranchera +</span>
                    <span>Pasta Doria +</span>
                    <span>Galletas Noel +</span>
                    <span>Chocolisto +</span>
                </div>

                <div class="acciones-hero">
                    <button class="btn-primary">Explorar recetas</button>
                    <button class="btn-secondary">Mi despensa · 0 ingredientes</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/layout.js"></script>
</body>
</html>
